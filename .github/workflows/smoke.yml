name: smoke

# Minimal guard, not a test suite. It exists because two classes of breakage
# have shipped from this repo before and neither is visible by reading a diff:
# a syntax error in a script nobody re-ran, and an absolute path from the
# authors' workstation leaking back into a file. Both are cheap to catch here.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every script parses
        run: python -m compileall -q scripts

      - name: No known workstation path patterns in tracked text
        # Same pattern set the checkpoint scanner uses, so the two gates cannot
        # drift apart: Windows drives, UNC shares, the usual POSIX user and
        # scratch roots, and the pre-release codename.
        run: |
          if git grep -nEIi '([A-Za-z]:\\|\\\\[A-Za-z0-9]|(^|[^.[:alnum:]_])/(home|users|mnt|media|opt|srv|var|root|tmp|private|data)/[A-Za-z0-9._-]+/|research_ws|yolo26-nms-free)' \
               -- '*.py' '*.ps1' '*.yaml' '*.yml' '*.md' '*.cff' '*.csv' '*.txt' \
               ':!THIRD_PARTY_NOTICES.md' ':!.github/workflows/smoke.yml' \
               ':!scripts/sanitize_checkpoints.py'; then
            echo "::error::a workstation path or the pre-release codename is committed"
            exit 1
          fi

      - name: Analysis that needs only the shipped CSVs still runs
        run: |
          pip install --quiet numpy
          python scripts/decomp_endpoint_check.py
          python scripts/recoverability_table.py

      - name: Cache-integrity guards hold
        run: python tests/test_cache_integrity.py

      - name: Released checkpoints carry no machine-local paths
        # The recursive scanner, not a grep for one known substring: the paths
        # live in two places inside the pickle and a substring check cannot
        # speak to POSIX paths or to a machine other than the one that trained
        # these. --check exits non-zero if anything remains.
        run: |
          # The checkpoints pickle Ultralytics model objects, so unpickling
          # them needs those classes importable -- torch alone would fail on
          # import before the scan ran, turning a green gate red for the wrong
          # reason. Pin the same release the results were produced with.
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet 'ultralytics==8.4.64'
          python tests/test_path_leaks.py
          python scripts/sanitize_checkpoints.py --check
          # Belt and braces: the scanner is bounded at depth 8, so also grep the
          # raw bytes for the drive-letter and codename forms it would miss.
          if grep -aoE '([A-Za-z]:\\|research_ws|YOLO26-NMS-FREE)' weights_release/*.pt; then
            echo "::error::checkpoint bytes still contain a workstation path"
            exit 1
          fi
